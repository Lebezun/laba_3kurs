name: CI/CD Pipeline

on:
  push:
    branches: [ "prod" ] # Пайплайн спрацює при пуші в гілку prod

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ОСЬ ЦЕЙ КРОК ВИРІШИТЬ ПРОБЛЕМУ З ІМ'ЯМ 'db'
      - name: Map db hostname to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/test_db
          SECRET_KEY: github_actions_secret_key_123
          PYTHONPATH: .
        run: poetry run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd ~/labka
            git fetch origin prod
            git reset --hard origin/prod
            # Видаляємо старі образи перед новим білдом, щоб звільнити місце
            docker system prune -f 
            docker compose down
            docker compose up -d --build
            # Видаляємо кеш білду після успішного запуску
            docker image prune -f