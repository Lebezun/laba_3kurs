global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'fastapi-lab-monitoring'

scrape_configs:
  - job_name: 'fastapi_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000'] # ПОВЕРНУЛИ НАЗАД
    scrape_interval: 10s

  - job_name: 'PostgreSQL'
    static_configs:
      - targets: ['postgres_exporter:9187']
    scrape_interval: 10s

  - job_name: 'Node'
    static_configs:
      - targets: ['node_exporter:9100']
    scrape_interval: 15s
    
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  - job_name: 'Prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s